<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="100%" stop-color="#0d0a14"/>
    </linearGradient>
    <linearGradient id="peak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="peakShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d75"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- outer ring: nod to WSL / desktop window frame -->
  <circle cx="256" cy="248" r="176" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.55"/>
  <circle cx="256" cy="248" r="176" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <!-- mountain / "A" for AlmaLinux, built from a terminal-cursor negative space -->
  <g filter="url(#soft)">
    <path d="M256 118 L366 330 L146 330 Z" fill="url(#peak)"/>
    <path d="M256 118 L366 330 L308 330 Z" fill="url(#peakShadow)" opacity="0.55"/>
    <!-- crossbar reimagined as a terminal caret -->
    <rect x="204" y="256" width="104" height="22" rx="4" fill="#0d0a14"/>
    <rect x="234" y="256" width="16" height="22" fill="#38bdf8"/>
  </g>

  <!-- five nodes: one per desktop environment (Gnome, KDE, MATE, Xfce, Cinnamon) -->
  <g>
    <circle cx="166" cy="372" r="10" fill="#38bdf8"/>
    <circle cx="211" cy="372" r="10" fill="#22d3ee"/>
    <circle cx="256" cy="372" r="10" fill="#a78bfa"/>
    <circle cx="301" cy="372" r="10" fill="#f472b6"/>
    <circle cx="346" cy="372" r="10" fill="#4ade80"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="40" fill="#f5f3ff" letter-spacing="1">ALMALINUX</text>
  <text x="256" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="20" fill="#a78bfa" letter-spacing="6">WSL DESKTOPS</text>
</svg>
