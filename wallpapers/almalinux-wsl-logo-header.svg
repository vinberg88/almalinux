<svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="peak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="peakShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d75"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- icon: mountain "A" mark, no background box so it drops cleanly onto a README -->
  <g transform="translate(20,10)">
    <circle cx="80" cy="80" r="74" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.5"/>
    <path d="M80 34 L134 132 L26 132 Z" fill="url(#peak)"/>
    <path d="M80 34 L134 132 L104 132 Z" fill="url(#peakShadow)" opacity="0.55"/>
    <rect x="54" y="98" width="52" height="12" rx="2" fill="#0d0a14"/>
    <rect x="70" y="98" width="9" height="12" fill="#38bdf8"/>
    <!-- five small nodes for the five desktops, tucked under the peak -->
    <circle cx="42" cy="146" r="5" fill="#38bdf8"/>
    <circle cx="61" cy="146" r="5" fill="#22d3ee"/>
    <circle cx="80" cy="146" r="5" fill="#a78bfa"/>
    <circle cx="99" cy="146" r="5" fill="#f472b6"/>
    <circle cx="118" cy="146" r="5" fill="#4ade80"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="98" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#f5f3ff" letter-spacing="1">AlmaLinux</text>
  <text x="200" y="132" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="24" fill="#a78bfa" letter-spacing="3">WSL DESKTOPS</text>
</svg>
