<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="AlmaLinux 10 for WSL - Build the Linux desktop you want on Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020914"/>
      <stop offset="0.48" stop-color="#071b34"/>
      <stop offset="1" stop-color="#083f78"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="32%" r="55%">
      <stop offset="0" stop-color="#169fff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#169fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb8ff"/>
      <stop offset=".55" stop-color="#0d79d8"/>
      <stop offset="1" stop-color="#063b75"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a00" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ff8a00" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffbd3c" stop-opacity="0"/>
    </linearGradient>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1500" height="500" rx="26" fill="url(#bg)"/>
  <rect width="1500" height="500" rx="26" fill="url(#glow)"/>
  <path d="M0 402 C250 312 420 470 680 382 S1120 300 1500 390 V500 H0Z" fill="#041323" opacity=".82"/>
  <path d="M-80 425 C260 290 470 480 790 365 S1200 300 1580 360" fill="none" stroke="url(#orange)" stroke-width="5" opacity=".8"/>
  <path d="M-30 105 C280 0 520 18 740 110" fill="none" stroke="#0e88e8" stroke-width="14" opacity=".22"/>
  <ellipse cx="1260" cy="110" rx="260" ry="115" fill="#1a91ff" opacity=".09" filter="url(#soft)"/>

  <!-- AlmaLinux-inspired color mark -->
  <g transform="translate(105 102)">
    <circle cx="45" cy="8" r="17" fill="#ef4444"/>
    <circle cx="82" cy="27" r="17" fill="#facc15"/>
    <circle cx="93" cy="68" r="17" fill="#84cc16"/>
    <circle cx="55" cy="92" r="17" fill="#22c55e"/>
    <circle cx="16" cy="72" r="17" fill="#0ea5e9"/>
    <circle cx="5" cy="32" r="17" fill="#1787ff"/>
    <circle cx="49" cy="49" r="17" fill="#071b34"/>
    <path d="M45 24 C62 26 72 35 77 48" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <path d="M76 44 C77 57 72 68 61 77" fill="none" stroke="#facc15" stroke-width="12" stroke-linecap="round"/>
    <path d="M60 78 C45 84 32 81 22 72" fill="none" stroke="#84cc16" stroke-width="12" stroke-linecap="round"/>
    <path d="M22 70 C14 56 15 43 23 32" fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
    <path d="M24 31 C31 24 37 22 45 23" fill="none" stroke="#1787ff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Main brand -->
  <text x="245" y="166" fill="#f7fbff" font-family="Segoe UI,Arial,sans-serif" font-size="94" font-weight="800" letter-spacing="-4">AlmaLinux</text>
  <text x="245" y="211" fill="#c4d4e8" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="8">ENTERPRISE LINUX FOR EVERYONE</text>
  <line x1="245" y1="242" x2="710" y2="242" stroke="#6c8daf" stroke-width="2" opacity=".55"/>
  <text x="245" y="282" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="9">ON WSL2</text>
  <line x1="442" y1="272" x2="710" y2="272" stroke="#6c8daf" stroke-width="2" opacity=".45"/>

  <!-- Big version number -->
  <g filter="url(#blueGlow)">
    <text x="825" y="296" fill="url(#num)" stroke="#6bd0ff" stroke-width="2" font-family="Segoe UI,Arial,sans-serif" font-size="235" font-weight="800" letter-spacing="-18">10</text>
  </g>

  <!-- Windows mark -->
  <g transform="translate(1238 80) skewY(-6)" opacity=".9" filter="url(#blueGlow)">
    <rect x="0" y="0" width="75" height="75" fill="#118fe8"/>
    <rect x="84" y="-7" width="88" height="82" fill="#1fa6ff"/>
    <rect x="0" y="84" width="75" height="77" fill="#0877d4"/>
    <rect x="84" y="84" width="88" height="84" fill="#1298f2"/>
  </g>

  <text x="1250" y="302" fill="#a9cce9" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">WINDOWS + LINUX</text>

  <!-- desktop strip -->
  <rect x="70" y="350" width="1360" height="94" rx="22" fill="#020914" opacity=".7" stroke="#144d77"/>
  <text x="105" y="384" fill="#6cc9ff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="5">DESKTOP LAB</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#eef7ff">
    <g transform="translate(105 405)"><circle cx="0" cy="0" r="7" fill="#36a8ff"/><text x="17" y="7">KDE Plasma 6</text></g>
    <g transform="translate(310 405)"><circle cx="0" cy="0" r="7" fill="#ffffff"/><text x="17" y="7">GNOME</text></g>
    <g transform="translate(455 405)"><circle cx="0" cy="0" r="7" fill="#b9d7ec"/><text x="17" y="7">Xfce</text></g>
    <g transform="translate(565 405)"><circle cx="0" cy="0" r="7" fill="#84cc16"/><text x="17" y="7">MATE</text></g>
    <g transform="translate(690 405)"><circle cx="0" cy="0" r="7" fill="#f97316"/><text x="17" y="7">Cinnamon</text></g>
    <g transform="translate(865 405)"><circle cx="0" cy="0" r="7" fill="#a855f7"/><text x="17" y="7">Budgie</text></g>
    <g transform="translate(1010 405)"><circle cx="0" cy="0" r="7" fill="#22d3ee"/><text x="17" y="7">Deepin</text></g>
  </g>

  <text x="750" y="474" text-anchor="middle" fill="#9bb5cc" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="6">BUILD THE LINUX DESKTOP YOU WANT ON WINDOWS</text>
  <rect x="1" y="1" width="1498" height="498" rx="25" fill="none" stroke="#198de4" stroke-opacity=".35"/>
</svg>
